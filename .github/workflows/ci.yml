name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitness_club
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/fitness_club
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Test
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package

      # Хранилище и пароли берутся только из GitHub Secrets и не попадают в артефакты
      - name: HTTPS smoke test
        env:
          SSL_KEYSTORE_BASE64: ${{ secrets.SSL_KEYSTORE_BASE64 }}
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$SSL_KEYSTORE_BASE64" ] || [ -z "$SSL_KEYSTORE_PASSWORD" ] || [ -z "$JWT_SECRET" ]; then
            echo "::warning::Секреты SSL_KEYSTORE_BASE64, SSL_KEYSTORE_PASSWORD, JWT_SECRET не заданы, проверка HTTPS пропущена"
            exit 0
          fi
          KS="$RUNNER_TEMP/server.p12"
          echo "$SSL_KEYSTORE_BASE64" | base64 -d > "$KS"
          SSL_KEYSTORE="file:$KS" java -jar target/fitnessclub-*.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sk -o /dev/null https://localhost:8443/auth/csrf && break
            sleep 2
          done
          CHAIN=$(echo | openssl s_client -connect localhost:8443 -servername localhost -showcerts 2>/dev/null | grep -c "BEGIN CERTIFICATE")
          echo "Сертификатов в цепочке: $CHAIN"
          test "$CHAIN" -ge 3
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:8443/lessons)
          echo "GET /lessons без токена: $CODE"
          test "$CODE" = "401"
          kill %1 || true
          rm -f "$KS"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fitnessclub-jar
          path: target/fitnessclub-*.jar
          if-no-files-found: error
